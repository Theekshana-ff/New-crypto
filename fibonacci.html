<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fibonacci analysis</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="top">
 <div class="row">
  <button id="menuBtn" aria-label="Menu">&#9776;</button>
  <form class="search" id="searchForm"><input id="q" placeholder="Search coin (BTC, LINK...)" autocomplete="off"><button>Go</button><ul id="sug"></ul></form>
  <div class="clock"><div id="time"></div><div id="date"></div></div>
 </div>
 <div class="row sub"><div class="badge" id="badge"></div>
  <div class="tfbar inline" id="tfbar"><button data-tf="1m">1m</button><button data-tf="5m">5m</button><button data-tf="15m">15m</button><button data-tf="1h" class="on">1h</button><button data-tf="4h">4h</button><button data-tf="1d">1d</button><button data-tf="1w">1w</button></div></div>
</header>
<div id="scrim"></div>
<nav id="drawer"><h3>Menu</h3><a href="index.html">Home</a><a href="smc.html">SMC</a><a href="fibonacci.html">Fibonacci</a><a href="patterns.html">Chart patterns</a><a href="journal.html">Trade journal</a><a href="risk.html">Risk calculator</a><a href="links.html">Other websites</a></nav>
<main>
 <div class="tools tfbar inline" id="tools"><button data-l="ret" class="on">Levels</button><button data-l="ote" class="on">Buy/Sell zone</button><button id="fset">⚙ Settings</button><button id="fman">✋ Manual leg</button><button id="fauto">Auto</button>
  <select id="htf"><option value="">HTF fib: off</option><option value="1h">HTF 1h</option><option value="4h" selected>HTF 4h</option><option value="1d">HTF 1d</option><option value="1w">HTF 1w</option></select>
  <select id="sw"><option value="3">Swing: small</option><option value="6" selected>Swing: medium</option><option value="10">Swing: large</option></select>
  <button id="alBtn">🔔 Alerts</button><span class="sp"></span><button id="zin">＋</button><button id="zout">－</button><button id="zfit">Fit</button><button id="zbig">⛶</button></div>
 <section class="card" id="fcfg" hidden><h3>Fibonacci settings</h3>
  <div class="rin"><select id="fpre"><option value="">Template</option></select><button id="fsave" class="moreBtn" style="margin:0">Save as</button><button id="fdel" class="moreBtn" style="margin:0">Delete</button></div>
  <div id="fgrid"></div><div class="rin" style="margin-top:10px"><label>Buy/Sell zone from<input id="z1" type="number" step="any"></label><label>to<input id="z2" type="number" step="any"></label></div><button id="freset" class="moreBtn">Reset to default</button></section>
 <p id="hint" class="msg"></p><section class="card" id="ALP" hidden style="margin-bottom:10px"></section>
 <p id="err" class="msg"></p>
 <div id="box"><div id="cht"></div></div>
 <div class="two"><section class="card" id="B"></section><section class="card" id="D"></section></div>
 <section class="card" id="HB" style="margin-top:12px"></section>
 <section class="card" id="CX" style="margin-top:12px"></section>
 <div class="two"><section class="card" id="R"></section><section class="card" id="RX"></section></div>
 <div class="two"><section class="card" id="SV"></section><section class="card" id="BT"></section></div>
 <section class="card" id="SC" style="margin-top:12px"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="smc-core.js"></script><script src="fib-core.js"></script><script src="ctx.js"></script><script src="htf.js"></script><script src="alerts.js"></script><script src="fib.js"></script>
</body></html>
