name: 24/7 Cloud Crypto Intelligence Auto-Pilot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cloud-intelligence-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Run 24/7 Background Intelligence & Zero-Loss Guardian Every 20s
        env:
          SITE_URL: "https://newcrypto-dar0tmxdl-theekshana-ff.vercel.app/"
          FALLBACK_URL: "https://newcrypto-three.vercel.app"
        run: |
          for i in $(seq 1 14); do
            curl -s "${SITE_URL}/api/futures-agent?action=cron_tick" || true
            curl -s "${FALLBACK_URL}/api/futures-agent?action=cron_tick" || true
            sleep 20
          done
