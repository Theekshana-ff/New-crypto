name: Find working signals on real data
on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:
    inputs:
      coins:
        description: 'How many top coins'
        default: '20'
permissions:
  contents: write
concurrency:
  group: strategy-search
  cancel-in-progress: false
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/strategy-search.js
        env:
          NCOINS: ${{ github.event.inputs.coins || '20' }}
          TFS: '15m,1h,4h'
          CANDLES: '3000'
          FEE: '0.0012'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit strategy.json
        run: |
          git config user.name "strategy-bot"
          git config user.email "strategy-bot@users.noreply.github.com"
          git add strategy.json
          git diff --cached --quiet || (git commit -m "Update strategy rules" && git push)
